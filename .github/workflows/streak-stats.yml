name: Update streak stats

on:
  schedule:
    - cron: "0 3 * * *" # Run every day at 03:00
  push:
    paths:
      - ".github/workflows/streak-stats.yml" # Run when this file changes
  workflow_dispatch: # Run manually from the Actions tab

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=${{ github.repository_owner }}&background=161B22&border=21262D&stroke=0f5a5e&ring=0f5a5e&fire=0f5a5e&currStreakNum=E6EDF2&sideNums=8B949E&currStreakLabel=E6EDF2&sideLabels=8B949E&dates=8B949E&disable_animations=true
          path: dist/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push streak stats to streak branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: streak
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
